[workspace]

members = [
    "medic-check-rust",
    "medic-outdated-rust",
    "medic-step-rust",
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6" }
fancy-regex = "0.18"
indoc = "2.0.1"
itertools = "0.14"
medic-lib = "0.3"
regex = "1.7"
serde = "1.0"
serde_json = "1.0"
which = "8.0"

[workspace.package]
authors = ["Eric Saxby <sax@livinginthepast.org>", "synchonal.dev"]
description = "Development workflow automation/suggestion"
edition = "2024"
homepage = "https://github.com/synchronal"
license = "MIT"
readme = "./README.md"
repository = "https://github.com/synchronal/medic-ext-rust"
version = "1.1.0"
